name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend · lint · format · test · build
    runs-on: ubuntu-latest
    env:
      # Dummy URL: unit tests mock the DB and Prisma generate doesn't connect.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/settlement_rail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build

  frontend:
    name: Frontend · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
